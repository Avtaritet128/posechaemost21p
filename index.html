<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Журнал посещаемости</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #eef2f8; margin: 0; padding: 12px; min-height: 100vh; }

        .journal-header h1 { margin: 0; font-size: 1.4rem; font-weight: 650; }
        .journal-header p { margin: 0.3rem 0 0; opacity: 0.8; font-size: 0.7rem; }

        .subject-input { padding: 6px 10px; border-radius: 60px; border: 1px solid #cbd5e1; font-size: 0.75rem; background: white; width: 130px; }

        /* ==================== ВСПЛЫВАЮЩЕЕ СООБЩЕНИЕ ==================== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #0f2b3d;
            color: white;
            padding: 14px 22px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            z-index: 10000;

            max-width: 90%;

        }

            transform: translateX(-50%) translateY(0);

        }

        @media (max-width: 480px) {

            .student-icon-btn { padding: 5px 10px; }
            .summary-tag { font-size: 0.7rem; padding: 4px 10px; }
        }

</head>
<body>

    <div id="uniqueAttendanceBlock"></div>

    <div class="legend-bottom">
        <span>🟢 Присутствовал(а)</span>
        <span>🔴 Отсутствовал(а)</span>
        <span>👆 Нажмите на имя</span>
        <span>🔥 Синхронизация через Firebase</span>
    </div>
</div>

<script type="module">
// ==================== FIREBASE CONFIG ====================
const firebaseConfig = {
  apiKey: "AIzaSyAOn0s0YQiGo5bA4iSDCAZjY6NlAXIgEOU",
  authDomain: "posechaemost21p.firebaseapp.com",
  projectId: "posechaemost21p",
  storageBucket: "posechaemost21p.firebasestorage.app",
  messagingSenderId: "512441312712",
  appId: "1:512441312712:web:0de5f20f07bdff42bc0cfd",
  measurementId: "G-GE14XK36D1"
};

// ==================== ДАННЫЕ ====================
const STUDENTS_FULL = [
    "Аношин Михаил Александрович","Богданович Андрей Сергеевич","Бодров Максим Вячеславович",
    "Гневанов Арсений Данилович","Громов Денис Алексеевич",
    "Жороев Мухаммад Кудуратович","Зуев Андрей Алексеевич",
    "Кулешов Матвей Сергеевич","Латышев Роман Алексеевич","Лялин Даниил Евгеньевич",
    "Науменко Александр Алексеевич","Нугаев Тимур Рушанович",
    "Островская Диана Андреевна","Павлов Арсений Алексеевич","Перова Кристина Игоревна",
    "Семянченков Руслан Ихтиёрович","Хохлов Егор Андреевич","Цаплин Иван Николаевич",
    "Шалагин Артём Алексеевич","Яничев Егор Андреевич"
];
const STUDENTS_COUNT = STUDENTS_FULL.length;
const SUBJECTS_COUNT = 4;
const DAYS = ['mon', 'tue', 'wed', 'thu', 'fri'];
const DAY_NAMES = { mon: 'ПН', tue: 'ВТ', wed: 'СР', thu: 'ЧТ', fri: 'ПТ' };
const DAY_FULL  = { mon: 'Понедельник', tue: 'Вторник', wed: 'Среда', thu: 'Четверг', fri: 'Пятница' };
const ARCHIVE_RETENTION_DAYS = 365;

let currentDay = 'mon';
let attendanceData = {};
let subjectTexts = {};
let dateTexts = {};
let db = null;

// ==================== ИМПОРТ FIREBASE ====================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ==================== ИНДИКАТОР ====================
function setSyncStatus(text, color = '#2c5a7a') {
    let el = document.getElementById('syncStatus');
    if (!el) {
        el = document.createElement('div');
        el.id = 'syncStatus';
        el.style.cssText = 'position:fixed;bottom:10px;right:10px;background:white;border:1px solid #cbd5e1;padding:6px 12px;border-radius:40px;font-size:0.7rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);z-index:9999;transition:opacity 0.3s;';
        document.body.appendChild(el);
    }
    el.textContent = text;
    el.style.color = color;
    el.style.opacity = '1';
}

// ==================== ВСПЛЫВАЮЩЕЕ СООБЩЕНИЕ ====================
function showToast(text, duration = 6000) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 50);
    setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 500);
    }, duration);
}

// ==================== КОНВЕРТАЦИЯ ДАННЫХ ====================
// true/false → "был"/"не был" (для красивого вида в Firebase)
function convertAttendanceForSave(data) {
    const result = {};
    for (const day of DAYS) {
        result[day] = {};
        for (const student of STUDENTS_FULL) {
            const arr = data[day]?.[student] || [false, false, false, false];
            result[day][student] = arr.map(v => v ? 'был' : 'не был');
        }
    }
    return result;
}

// "был"/"не был" → true/false (при загрузке, понимает и старый формат)
function convertAttendanceFromLoad(data) {
    const result = {};
    for (const day of DAYS) {
        result[day] = {};
        for (const student of STUDENTS_FULL) {
            const arr = data[day]?.[student];
            if (!Array.isArray(arr)) {
                result[day][student] = [false, false, false, false];
            } else {
                result[day][student] = arr.map(v => v === 'был' || v === true);
            }
        }
    }
    return result;
}

// ==================== РАБОТА С НЕДЕЛЯМИ ====================
function getWeekInfo(date = new Date()) {
    const pad = (n) => String(n).padStart(2, '0');
    const fmtDMY = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${String(d.getFullYear()).slice(-2)}`;

    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay();
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    const monday = new Date(d);
    monday.setDate(d.getDate() + diffToMonday);

    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);

    const tmp = new Date(Date.UTC(monday.getFullYear(), monday.getMonth(), monday.getDate()));
    const dayNum = tmp.getUTCDay() || 7;
    tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
    const weekNumber = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
    const isoYear = tmp.getUTCFullYear();

    const mondayStr = fmtDMY(monday);
    const fridayStr = fmtDMY(friday);

    return {
        weekNumber,
        isoYear,
        id: `${monday.getFullYear()}-${pad(monday.getMonth() + 1)}-${pad(monday.getDate())}`,
        label: `${mondayStr}-${fridayStr}`,
        monday,
        friday
    };
}

function isWeekend(date = new Date()) {
    const day = date.getDay();
    return day === 0 || day === 6;
}

function hasAnyData() {
    for (const day of DAYS) {
        const dayData = attendanceData[day] || {};
        for (const student of STUDENTS_FULL) {
            if (dayData[student]?.some(v => v === true)) return true;
        }
    }
    return false;
}

// ==================== СТРУКТУРА ====================
function emptyDay() {
    const d = {};
    for (const s of STUDENTS_FULL) d[s] = [false, false, false, false];
    return d;
}

function emptyStructure() {
    const att = {}, sub = {}, dat = {};
    for (const day of DAYS) {
        att[day] = emptyDay();
        sub[day] = {0:'',1:'',2:'',3:''};
        dat[day] = {0:'',1:'',2:'',3:''};
    }
    return { attendance: att, subjectTexts: sub, dateTexts: dat };
}

function normalizeData() {
    for (const day of DAYS) {
        if (!attendanceData[day]) attendanceData[day] = {};
        if (!subjectTexts[day]) subjectTexts[day] = {0:'',1:'',2:'',3:''};
        if (!dateTexts[day]) dateTexts[day] = {0:'',1:'',2:'',3:''};
        for (const s of STUDENTS_FULL) {
            if (!Array.isArray(attendanceData[day][s])) attendanceData[day][s] = [false, false, false, false];
        }
        for (let i = 0; i < SUBJECTS_COUNT; i++) {
            if (subjectTexts[day][i] === undefined) subjectTexts[day][i] = '';
            if (dateTexts[day][i] === undefined) dateTexts[day][i] = '';
        }
    }
}

// ==================== АРХИВАЦИЯ ====================
async function checkAndArchive() {
    const now = new Date();
    if (!isWeekend(now)) return;
    if (!hasAnyData()) return;

    const lastWeekRef = new Date(now);
    lastWeekRef.setDate(now.getDate() - 1);
    const weekInfo = getWeekInfo(lastWeekRef);

    const archiveRef = doc(db, 'archives', weekInfo.id);
    const existing = await getDoc(archiveRef);
    if (existing.exists()) return;

    const now_ts = Date.now();
    const expiresAt = now_ts + ARCHIVE_RETENTION_DAYS * 24 * 60 * 60 * 1000;

    try {
        await setDoc(archiveRef, {
            attendance: convertAttendanceForSave(attendanceData),
            subjectTexts: subjectTexts,
            dateTexts: dateTexts,
            weekNumber: weekInfo.weekNumber,
            weekLabel: weekInfo.label,
            createdAt: serverTimestamp(),
            createdAtMs: now_ts,
            expiresAtMs: expiresAt
        });

        const empty = emptyStructure();
        await setDoc(doc(db, 'journal', 'main'), {
            attendance: convertAttendanceForSave(empty.attendance),
            subjectTexts: empty.subjectTexts,
            dateTexts: empty.dateTexts,
            updatedAt: serverTimestamp()
        });

        await cleanupOldArchives();

        showToast(`📁 Данные за «${weekInfo.label}» сохранены в архив. Журнал очищен.`, 6000);
    } catch (e) {
        console.error('Ошибка архивации:', e);
    }
}

async function cleanupOldArchives() {
    try {
        const now_ts = Date.now();
        const archivesCol = collection(db, 'archives');
        const snapshot = await getDocs(archivesCol);
        for (const d of snapshot.docs) {
            const data = d.data();
            if (data.expiresAtMs && data.expiresAtMs < now_ts) {
                await deleteDoc(doc(db, 'archives', d.id));
                console.log('Удалён старый архив:', d.id);
            }
        }
    } catch (e) {
        console.error('Ошибка очистки старых архивов:', e);
    }
}

// ==================== FIREBASE ====================
async function initFirebase() {
    setSyncStatus('⏳ Подключение…', '#a07c2e');
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);

        const ref = doc(db, 'journal', 'main');
        onSnapshot(ref, (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                attendanceData = convertAttendanceFromLoad(data.attendance || {});
                subjectTexts = data.subjectTexts || {};
                dateTexts = data.dateTexts || {};
                normalizeData();
                renderAll();
                setSyncStatus('✅ Синхронизировано', '#15803d');
                setTimeout(checkAndArchive, 1000);
            } else {
                const empty = emptyStructure();
                attendanceData = empty.attendance;
                subjectTexts = empty.subjectTexts;
                dateTexts = empty.dateTexts;
                saveToFirebase();
                setSyncStatus('✅ Создано', '#15803d');
            }
        }, (err) => {
            console.error(err);
            setSyncStatus('❌ Ошибка Firebase', '#b91c1c');
        });
    } catch (e) {
        console.error(e);
        setSyncStatus('❌ Ошибка подключения', '#b91c1c');
    }
}

let saveTimeout = null;
function saveToFirebase() {
    setSyncStatus('⏳ Сохранение…', '#a07c2e');
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
        try {
            await setDoc(doc(db, 'journal', 'main'), {
                attendance: convertAttendanceForSave(attendanceData),
                subjectTexts: subjectTexts,
                dateTexts: dateTexts,
                updatedAt: serverTimestamp()
            });
            setSyncStatus('✅ Сохранено', '#15803d');
            setTimeout(() => setSyncStatus('✅ Синхронизировано'), 1500);
        } catch (e) {
            console.error(e);
            setSyncStatus('❌ Ошибка сохранения', '#b91c1c');
        } finally {
            saveTimeout = null;
        }
    }, 400);
}

// ==================== ХЕЛПЕРЫ ====================
function getShortName(full) {
    const p = full.split(/\s+/);
    return p.length >= 2 ? `${p[0]} ${p[1]}` : full;
}
function getCurrentAttendance()   { return attendanceData[currentDay]; }
function getCurrentSubjectTexts() { return subjectTexts[currentDay]; }
function getCurrentDateTexts()    { return dateTexts[currentDay]; }
function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function updateAttendance(student, subjIdx, isPresent) {
    attendanceData[currentDay][student][subjIdx] = isPresent;
    renderAll();
    saveToFirebase();
}
function updateSubjectText(i, v) { subjectTexts[currentDay][i] = v; renderAll(); saveToFirebase(); }
function updateDateText(i, v)    { dateTexts[currentDay][i]    = v; renderAll(); saveToFirebase(); }

function resetCurrentDay() {
    if (!confirm(`Сбросить все отметки для ${DAY_FULL[currentDay]}?`)) return;
    for (const s of STUDENTS_FULL) attendanceData[currentDay][s] = [false, false, false, false];
    renderAll();
    saveToFirebase();
}
function clearAllData() {
    if (!confirm('Очистить ВСЕ данные (все дни)?')) return;
    for (const day of DAYS) {
        for (const s of STUDENTS_FULL) attendanceData[day][s] = [false, false, false, false];
        subjectTexts[day] = {0:'',1:'',2:'',3:''};
        dateTexts[day] = {0:'',1:'',2:'',3:''};
    }
    renderAll();
    saveToFirebase();
}

function getAttendedStudents() {
    const d = getCurrentAttendance();
    return STUDENTS_FULL.filter(s => d[s]?.some(v => v === true)).map(getShortName);
}
function getNeverAttendedStudents() {
    const d = getCurrentAttendance();
    return STUDENTS_FULL.filter(s => !d[s]?.some(v => v === true)).map(getShortName);
}
function getCurrentDayDate() {
    const dates = getCurrentDateTexts();
    for (let i = 0; i < SUBJECTS_COUNT; i++) if (dates[i]?.trim()) return dates[i].trim();
    return '';
}

// ==================== РЕНДЕР ====================
function renderWeekdays() {
    const bar = document.getElementById('weekdaysBar');
    bar.innerHTML = '';
    for (const day of DAYS) {
        const btn = document.createElement('button');
        btn.textContent = DAY_NAMES[day];
        btn.className = `day-btn ${currentDay === day ? 'active' : ''}`;
        btn.onclick = () => { currentDay = day; renderAll(); renderWeekdays(); };
        bar.appendChild(btn);
    }
}

function renderAttendedBlock() {
    const list = getAttendedStudents();
    const d = getCurrentDayDate();
    const dH = d ? `<div class="summary-date">📅 ${escapeHtml(d)}</div>` : '';
    document.getElementById('uniqueAttendanceBlock').innerHTML = `
        <div class="summary-block">
            <div class="summary-header">
                <h3>✅ ${DAY_FULL[currentDay]} — присутствовали на парах</h3>
                ${dH}
                <div class="summary-count">${list.length} / ${STUDENTS_COUNT}</div>
            </div>
            <div class="summary-list">
                ${list.length ? list.map(n => `<span class="summary-tag">${escapeHtml(n)}</span>`).join('') : `<div class="empty-summary">— никто не отмечен —</div>`}
            </div>
        </div>`;
}

function renderNeverAttendedBlock() {
    const list = getNeverAttendedStudents();
    const d = getCurrentDayDate();
    const dH = d ? `<div class="summary-date">📅 ${escapeHtml(d)}</div>` : '';
    document.getElementById('neverAttendedBlock').innerHTML = `
        <div class="summary-block never-block">
            <div class="summary-header">
                <h3>❌ ${DAY_FULL[currentDay]} — отсутствовали на парах</h3>
                ${dH}
                <div class="summary-count">${list.length} / ${STUDENTS_COUNT}</div>
            </div>
            <div class="summary-list">
                ${list.length ? list.map(n => `<span class="summary-tag">${escapeHtml(n)}</span>`).join('') : `<div class="empty-summary">— все были хотя бы на одной паре —</div>`}
            </div>
        </div>`;
}

function renderStudentsList() {
    const container = document.getElementById('studentsList');
    const dayData = getCurrentAttendance();
    const texts = getCurrentSubjectTexts();
    container.innerHTML = '';
    for (const student of STUDENTS_FULL) {
        const presents = dayData[student] || [false, false, false, false];
        const short = getShortName(student);
        let sHtml = '';
        for (let i = 0; i < SUBJECTS_COUNT; i++) {
            const isP = presents[i];
            const label = texts[i] ? `${i+1} — ${escapeHtml(texts[i])}` : `${i+1} пара`;
            sHtml += `<div class="subject-item">
                <span class="subject-label">${escapeHtml(label)}</span>
                <span class="status-badge ${isP ? 'status-present' : 'status-absent'}">${isP ? 'Присутствовал(а)' : 'Отсутствовал(а)'}</span>
                <div class="student-actions">
                    <button class="student-icon-btn add-btn" data-student="${escapeHtml(student)}" data-subj="${i}">➕</button>
                    <button class="student-icon-btn remove-btn" data-student="${escapeHtml(student)}" data-subj="${i}">➖</button>
                </div>
            </div>`;
        }
        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `<div class="student-name">${escapeHtml(short)}</div><div class="subjects-row">${sHtml}</div>`;
        container.appendChild(card);
    }
    container.querySelectorAll('.add-btn').forEach(b => b.onclick = () => updateAttendance(b.dataset.student, +b.dataset.subj, true));
    container.querySelectorAll('.remove-btn').forEach(b => b.onclick = () => updateAttendance(b.dataset.student, +b.dataset.subj, false));
}

function renderSummaries() {
    const container = document.getElementById('summaryContainer');
    const dayData = getCurrentAttendance();
    const texts = getCurrentSubjectTexts();
    const dates = getCurrentDateTexts();
    let html = '';
    for (let i = 0; i < SUBJECTS_COUNT; i++) {
        const present = [], absent = [];
        for (const s of STUDENTS_FULL) {
            const short = getShortName(s);
            (dayData[s]?.[i] ? present : absent).push(short);
        }
        html += `<div class="summary-card">
            <div class="card-header">
                <div><strong>${i+1} пара</strong>
                    <input class="subject-input" value="${escapeHtml(texts[i]||'')}" placeholder="Название..." data-subj="${i}"></div>
                <div><span style="background:white;padding:2px 10px;border-radius:40px;">${present.length}/${STUDENTS_COUNT}</span>
                    <input class="date-input" value="${escapeHtml(dates[i]||'')}" placeholder="ДД.ММ.ГГГГ" data-subj="${i}"></div>
            </div>
            <div class="split-lists">
                <div class="section-title" style="color:#15803d;">✅ ПРИСУТСТВОВАЛ(А) <span class="count-badge">${present.length}</span></div>
                <div>${present.length ? present.map(n => `<span class="student-tag" data-short="${escapeHtml(n)}" data-subj="${i}" data-status="present">${escapeHtml(n)}</span>`).join('') : '<div class="empty-message">— пусто —</div>'}</div>
                <div class="section-title" style="color:#b91c1c;margin-top:12px;">❌ ОТСУТСТВОВАЛ(А) <span class="count-badge">${absent.length}</span></div>
                <div>${absent.length ? absent.map(n => `<span class="student-tag" data-short="${escapeHtml(n)}" data-subj="${i}" data-status="absent">${escapeHtml(n)}</span>`).join('') : '<div class="empty-message">— пусто —</div>'}</div>
            </div>
        </div>`;
    }
    container.innerHTML = html;
    container.querySelectorAll('.subject-input').forEach(inp => inp.onchange = () => updateSubjectText(+inp.dataset.subj, inp.value));
    container.querySelectorAll('.date-input').forEach(inp => inp.onchange = () => updateDateText(+inp.dataset.subj, inp.value));
    container.querySelectorAll('.student-tag').forEach(t => t.onclick = () => {
        const short = t.dataset.short, subj = +t.dataset.subj;
        const newStatus = t.dataset.status !== 'present';
        const full = STUDENTS_FULL.find(s => getShortName(s) === short);
        if (full) updateAttendance(full, subj, newStatus);
    });
}

function renderAll() {
    renderAttendedBlock();
    renderNeverAttendedBlock();
    renderStudentsList();
    renderSummaries();
}

// ==================== СТАРТ ====================
document.getElementById('resetDayBtn').onclick = resetCurrentDay;
document.getElementById('clearAllBtn').onclick = clearAllData;

renderWeekdays();
const empty = emptyStructure();
attendanceData = empty.attendance;
subjectTexts = empty.subjectTexts;
dateTexts = empty.dateTexts;
renderAll();
initFirebase();
</script>
</body>
